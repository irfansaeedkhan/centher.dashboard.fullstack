name: Play-kub - Lint, Build & Deploy

on:
  push:
    branches:
      - play-kub
  pull_request:
    branches:
      - play-kub
env:
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  lint-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2
        with:
          install: true

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-multi-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-multi-buildx

      - name: Create empty .env.staging for docker build
        run: |
          touch .env.staging

      - name: Build image to test build
        uses: docker/build-push-action@v4
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          file: docker/playground/Dockerfile
          push: false
          tags: ${{ github.sha }}
          target: runner
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,mode=max,dest=/tmp/.buildx-cache-new

        # Temp fix
        # https://github.com/docker/build-push-action/issues/252
        # https://github.com/moby/buildkit/issues/1896
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  lint-build-deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment:
      name: playground-kub
      url: https://play-kubapp.centher.io

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2
        with:
          install: true

      - name: Setup build time public environment variables from vars context and store in .env.staging
        run: |
          echo "NEXT_PUBLIC_APP_ENV=${{ vars.NEXT_PUBLIC_APP_ENV }}" >> .env.staging
          echo "NEXT_PUBLIC_CAPI_HOST=${{ vars.NEXT_PUBLIC_CAPI_HOST }}" >> .env.staging
          echo "NEXT_PUBLIC_CIS_HOST=${{ vars.NEXT_PUBLIC_CIS_HOST }}" >> .env.staging
          echo "NEXT_PUBLIC_CFS_HOST=${{ vars.NEXT_PUBLIC_CFS_HOST }}" >> .env.staging
          echo "NEXT_PUBLIC_INFURA_AUTH=${{ vars.NEXT_PUBLIC_INFURA_AUTH }}" >> .env.staging
          echo "NEXT_PUBLIC_MORALIS_URL=${{ vars.NEXT_PUBLIC_MORALIS_URL }}" >> .env.staging
          echo "NEXT_PUBLIC_IPFS_GATEWAY_URL=${{ vars.NEXT_PUBLIC_IPFS_GATEWAY_URL }}" >> .env.staging
          echo "NEXT_PUBLIC_PRE_BOOKING_API_URL=${{ vars.NEXT_PUBLIC_PRE_BOOKING_API_URL }}" >> .env.staging
          echo "NEXT_PUBLIC_GOOGLE_SITE_KEY=${{ vars.NEXT_PUBLIC_GOOGLE_SITE_KEY }}" >> .env.staging
          echo "NEXT_PUBLIC_RECAPTCHA_SERVICE_API_HOST=${{ vars.NEXT_PUBLIC_RECAPTCHA_SERVICE_API_HOST }}" >> .env.staging
          echo "NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID }}" >> .env.staging
          echo "NEXT_PUBLIC_HASURA_URL=${{ vars.NEXT_PUBLIC_HASURA_URL }}" >> .env.staging
          echo "NEXT_PUBLIC_WALLET_SERVICE_URL=${{ vars.NEXT_PUBLIC_WALLET_SERVICE_URL }}" >> .env.staging
          echo "NEXT_PUBLIC_WALLET_SERVICE_API_KEY=${{ vars.NEXT_PUBLIC_WALLET_SERVICE_API_KEY }}" >> .env.staging
          echo "NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID=${{ vars.NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID }}" >> .env.staging
          echo "NEXT_PUBLIC_GQL_URL_MAIN=${{ vars.NEXT_PUBLIC_GQL_URL_MAIN }}" >> .env.staging
          echo "NEXT_PUBLIC_GQL_URL_SUBGRAPH=${{ vars.NEXT_PUBLIC_GQL_URL_SUBGRAPH }}" >> .env.staging
          echo "NEXT_PUBLIC_GQL_URL_BLOCKCHAIN=${{ vars.NEXT_PUBLIC_GQL_URL_BLOCKCHAIN }}" >> .env.staging
          echo "NEXT_PUBLIC_GQL_URL_WEBSOCKET=${{ vars.NEXT_PUBLIC_GQL_URL_WEBSOCKET }}" >> .env.staging

      - name: Log in to Docker Hub
        id: login-docker-hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_PLAYGROUND }}
          password: ${{ secrets.DOCKERHUB_TOKEN_PLAYGROUND }}

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-single-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-single-buildx

      - name: Image Name
        id: image-name
        env:
          TAGGED_IMAGE: ${{ secrets.DOCKERHUB_USERNAME_PLAYGROUND }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          echo "tagged_image=$TAGGED_IMAGE" >> $GITHUB_OUTPUT

      - name: Build staging image
        uses: docker/build-push-action@v4
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          file: docker/playground/Dockerfile
          push: true
          target: runner
          tags: ${{ steps.image-name.outputs.tagged_image }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,mode=max,dest=/tmp/.buildx-cache-new

        # Temp fix
        # https://github.com/docker/build-push-action/issues/252
        # https://github.com/moby/buildkit/issues/1896
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Create kubeconfig
        run: |
          mkdir ${HOME}/.kube
          cd ${HOME}/.kube
          echo ${{ secrets.KUBE_CONFIG_PLAYGROUND }} | base64 --decode > ${HOME}/.kube/config

      - name: Delete existing image pull secret
        run: |
          export KUBECONFIG=${HOME}/.kube/config
          kubectl delete secret play-kub-app-centh-pull-secret -n centher-io-nsp
        continue-on-error: true

      - name: Create image pull secret from dockerhub
        run: |
          kubectl create secret docker-registry play-kub-app-centh-pull-secret -n centher-io-nsp \
            --docker-username=${{ secrets.DOCKERHUB_USERNAME_PLAYGROUND }} \
            --docker-password=${{ secrets.DOCKERHUB_TOKEN_PLAYGROUND }}

      - name: Changed tag name
        run: |
          sed -i "s#{ IMAGE_TAG }#${{ steps.image-name.outputs.tagged_image }}#g" ./k8s/play-kub/app-centher-io-deployment.yml
      
      - name: Check kubernetes file before deployment
        run: |
          export KUBECONFIG=${HOME}/.kube/config
          kubectl apply --dry-run=client --validate=true -f ./k8s/play-kub/app-centher-io-deployment.yml
          kubectl apply --dry-run=client --validate=true -f ./k8s/play-kub/app-centher-io-service.yml

      - name: Deploy to play-kub kubernetes cluster
        run: |
          export KUBECONFIG=${HOME}/.kube/config
          kubectl apply -f ./k8s/play-kub/app-centher-io-deployment.yml
          kubectl apply -f ./k8s/play-kub/app-centher-io-service.yml

      - name: Wait for deployment to complete
        run: kubectl rollout status deploy/app-centher-io-deployment -n centher-io-nsp --timeout=300s
      
      - name: Delete existing image pull secret
        run: |
          export KUBECONFIG=${HOME}/.kube/config
          kubectl delete secret play-kub-app-centh-pull-secret -n centher-io-nsp
      
      - name: Remove config file
        run: |
          rm ${HOME}/.kube/config