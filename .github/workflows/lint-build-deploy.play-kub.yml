name: PlayKube-CI

on:
  push:
    branches:
      - play-kub
  pull_request:
    branches:
      - play-kub

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment:
      name: playground-kub
      url: https://play-kubapp.centher.io
    env:
      docker_image_name: centher/play-kub-site-dapp-frontend:${{ github.run_number }}
      git_repo: algoalliance-io/dapp_gitops  # Corrected to owner/repo format
      yaml_path: site_dapp_frontend/deployment.yaml
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2
        with:
          install: true

      - name: Log in to Docker Hub
        id: login-docker-hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_PLAYGROUND }}
          password: ${{ secrets.DOCKERHUB_TOKEN_PLAYGROUND }}

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ github.ref_name }}-

      - name: Setup build time public environment variables from vars context and store in .env.staging
        run: |
          echo "NEXT_PUBLIC_APP_ENV=${{ vars.NEXT_PUBLIC_APP_ENV }}" >> .env.staging
          echo "NEXT_PUBLIC_CAPI_HOST=${{ vars.NEXT_PUBLIC_CAPI_HOST }}" >> .env.staging
          echo "NEXT_PUBLIC_CIS_HOST=${{ vars.NEXT_PUBLIC_CIS_HOST }}" >> .env.staging
          echo "NEXT_PUBLIC_CFS_HOST=${{ vars.NEXT_PUBLIC_CFS_HOST }}" >> .env.staging
          echo "NEXT_PUBLIC_INFURA_AUTH=${{ vars.NEXT_PUBLIC_INFURA_AUTH }}" >> .env.staging
          echo "NEXT_PUBLIC_MORALIS_URL=${{ vars.NEXT_PUBLIC_MORALIS_URL }}" >> .env.staging
          echo "NEXT_PUBLIC_IPFS_GATEWAY_URL=${{ vars.NEXT_PUBLIC_IPFS_GATEWAY_URL }}" >> .env.staging
          echo "NEXT_PUBLIC_PRE_BOOKING_API_URL=${{ vars.NEXT_PUBLIC_PRE_BOOKING_API_URL }}" >> .env.staging
          echo "NEXT_PUBLIC_GOOGLE_SITE_KEY=${{ vars.NEXT_PUBLIC_GOOGLE_SITE_KEY }}" >> .env.staging
          echo "NEXT_PUBLIC_RECAPTCHA_SERVICE_API_HOST=${{ vars.NEXT_PUBLIC_RECAPTCHA_SERVICE_API_HOST }}" >> .env.staging
          echo "NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID }}" >> .env.staging
          echo "NEXT_PUBLIC_HASURA_URL=${{ vars.NEXT_PUBLIC_HASURA_URL }}" >> .env.staging
          echo "NEXT_PUBLIC_WALLET_SERVICE_URL=${{ vars.NEXT_PUBLIC_WALLET_SERVICE_URL }}" >> .env.staging
          echo "NEXT_PUBLIC_WALLET_SERVICE_API_KEY=${{ vars.NEXT_PUBLIC_WALLET_SERVICE_API_KEY }}" >> .env.staging
          echo "NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID=${{ vars.NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID }}" >> .env.staging
          echo "NEXT_PUBLIC_GQL_URL_MAIN=${{ vars.NEXT_PUBLIC_GQL_URL_MAIN }}" >> .env.staging
          echo "NEXT_PUBLIC_GQL_URL_SUBGRAPH=${{ vars.NEXT_PUBLIC_GQL_URL_SUBGRAPH }}" >> .env.staging
          echo "NEXT_PUBLIC_GQL_URL_BLOCKCHAIN=${{ vars.NEXT_PUBLIC_GQL_URL_BLOCKCHAIN }}" >> .env.staging
          echo "NEXT_PUBLIC_GQL_URL_WEBSOCKET=${{ vars.NEXT_PUBLIC_GQL_URL_WEBSOCKET }}" >> .env.staging

      - name: Printing value
        run: |
          echo "\n!! Staging\n"
          cat .env.staging
          echo "\n!! Prining .env.production\n"
          cat .env.production

      - name: Build playground image
        id: build-image
        uses: docker/build-push-action@v4
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          file: docker/playground/Dockerfile
          push: true
          tags: ${{ env.docker_image_name }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,mode=max,dest=/tmp/.buildx-cache-new

      - name: Save Docker image name to output
        id: image-name
        run: echo "tagged_image=${{ env.docker_image_name }}" >> $GITHUB_ENV

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          
      - name: Checkout the dapp_gitops repository
        uses: actions/checkout@v3
        with:
          repository: ${{ env.git_repo }}  # Using the correct owner/repo format
          token: ${{ secrets.GITOPS_TOKEN }}
          path: dapp_gitops
          ref: ${{ github.ref_name }}

      - name: Update deployment.yaml with new Docker image tag
        run: |
          export docker_image_name="${{ env.docker_image_name }}"
          export yaml_path="${{ env.yaml_path }}"
          sed -i "s|image:.*|image: ${docker_image_name}|g" dapp_gitops/${yaml_path}
          
      - name: Commit and push changes to dapp_gitops repository
        run: |
          cd dapp_gitops
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add ${{ env.yaml_path }}
          git commit -m "Update Docker image tag to ${{ env.docker_image_name }}"
          git push origin ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITOPS_TOKEN }}