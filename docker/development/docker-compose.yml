version: "3"

services:
  dapp-sociaket-io-development:
    container_name: dapp-sociaket-io
    build:
      context: ../../
      dockerfile: docker/development/Dockerfile
    image: dapp-sociaket-io-development
    volumes:
      - ../../:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    networks:
      - sociaket-io

networks:
  sociaket-io:
    name: sociaket-io
    driver: bridge
